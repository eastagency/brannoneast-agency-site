[build]
  functions = "netlify/functions"

[[redirects]]
  from = "https://starlit-cupcake-806fc1.netlify.app/*"
  to = "https://brannoneast.agency/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://brannoneast-agency-site.netlify.app/*"
  to = "https://brannoneast.agency/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contract-bonds.html"
  to = "https://headwatersurety.com/bonds/georgia/performance-and-payment-bond/"
  status = 301
  force = true

[[redirects]]
  from = "/contract-bonds"
  to = "https://headwatersurety.com/bonds/georgia/performance-and-payment-bond/"
  status = 301
  force = true

[[redirects]]
  from = "/court-bonds.html"
  to = "https://headwatersurety.com/bonds/georgia/administrator-of-estate-bond/"
  status = 301
  force = true

[[redirects]]
  from = "/court-bonds"
  to = "https://headwatersurety.com/bonds/georgia/administrator-of-estate-bond/"
  status = 301
  force = true

[[redirects]]
  from = "/coi"
  to = "/staff-coi-tool.html"
  status = 200

[[redirects]]
  from = "/cancel"
  to = "/staff-cancellation-tool.html"
  status = 200

[[redirects]]
  from = "/sign"
  to = "/cancel-sign.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
# redeploy trigger

[functions]
  node_bundler = "esbuild"
