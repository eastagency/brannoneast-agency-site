name: Fall Recipe Quick-Hit (October)

on:
  schedule:
    - cron: '0 13 * * *'  # 9am ET daily; checks today's date against the calendar below, no-ops otherwise
  workflow_dispatch: {}

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine today's recipe topic (America/New_York)
        id: pick
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          case "$TODAY" in
            2026-10-07) TOPIC="A cozy, from-scratch chicken and dumplings recipe -- perfect comfort food for the first cool evenings of fall" ;;
            2026-10-14) TOPIC="A hearty vegetable beef soup recipe you can make ahead and eat all week" ;;
            2026-10-21) TOPIC="A creamy white chicken chili recipe, great for a chilly night in or watching the game" ;;
            2026-10-28) TOPIC="A warm butternut squash soup recipe to close out October" ;;
            *) TOPIC="" ;;
          esac
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "Today is $TODAY -- topic: ${TOPIC:-none}"

      - name: Set up Python
        if: steps.pick.outputs.topic != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.pick.outputs.topic != ''
        run: pip install anthropic requests

      - name: Generate caption + image
        if: steps.pick.outputs.topic != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ steps.pick.outputs.topic }}
          CAT: Recipe
          LINK_PATH: none
        run: python scripts/generate-quickhit-post.py generate

      - name: Commit and push image
        if: steps.pick.outputs.topic != ''
        run: |
          git config user.name "East Agency Bot"
          git config user.email "brannoneast1@gmail.com"
          git add assets/instagram/
          git diff --staged --quiet && echo "No image to commit" || git commit -m "Fall recipe: add generated image"
          git push

      - name: Get image URL
        if: steps.pick.outputs.topic != ''
        id: image
        run: |
          URL=$(python -c "import json; print(json.load(open('scripts/.quickhit_pending.json'))['image_url'])")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for image to go live
        if: steps.pick.outputs.topic != ''
        run: |
          URL="${{ steps.image.outputs.url }}"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "Image is live after attempt $i."
              exit 0
            fi
            echo "Attempt $i: got $CODE, waiting..."
            sleep 10
          done
          echo "Image never went live after 10 minutes"
          exit 1

      - name: Publish to Facebook + Instagram
        if: steps.pick.outputs.topic != ''
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/generate-quickhit-post.py publish

      - name: Commit history
        if: steps.pick.outputs.topic != ''
        run: |
          git config user.name "East Agency Bot"
          git config user.email "brannoneast1@gmail.com"
          git add scripts/quickhit_history.json
          git diff --staged --quiet && echo "No history change" || git commit -m "Fall recipe: record post"
          git push
