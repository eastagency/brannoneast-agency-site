name: Weekly Blog Post

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 2pm UTC (10am ET)
  workflow_dispatch:       # Run manually any time from GitHub Actions tab
    inputs:
      force_topic:
        description: 'Exact TOPICS keyword to force instead of the normal rotation (optional)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          FORCE_TOPIC_KEYWORD: ${{ github.event.inputs.force_topic }}
        run: python scripts/generate-post.py

      - name: Commit and push
        run: |
          git config user.name "East Agency Bot"
          git config user.email "brannoneast1@gmail.com"
          git add blog/ blog.html sitemap.xml scripts/topic_history.json assets/blog/
          git diff --staged --quiet && echo "No new post generated" || git commit -m "Auto blog: ${{ env.POST_TITLE }}"
          git push

      - name: Wait for hero image to go live
        run: |
          URL="${{ env.POST_IMAGE_URL }}"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "Image is live after attempt $i."
              exit 0
            fi
            echo "Attempt $i: got $CODE, waiting..."
            sleep 10
          done
          echo "Image never went live after 10 minutes"
          exit 1
