name: Quick-Hit Campaign Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'What the post is about'
        required: true
      cat:
        description: 'Category label (optional)'
        required: false
        default: 'Life Insurance'
      link_path:
        description: 'Site path the CTA should point to (optional)'
        required: false
        default: '/life-insurance-quote.html'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate caption + image
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          CAT: ${{ github.event.inputs.cat }}
          LINK_PATH: ${{ github.event.inputs.link_path }}
        run: python scripts/generate-quickhit-post.py generate

      - name: Commit and push image
        run: |
          git config user.name "East Agency Bot"
          git config user.email "brannoneast1@gmail.com"
          git add assets/instagram/
          git diff --staged --quiet && echo "No image to commit" || git commit -m "Quick-hit: add generated image"
          git push

      - name: Get image URL
        id: image
        run: |
          URL=$(python -c "import json; print(json.load(open('scripts/.quickhit_pending.json'))['image_url'])")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for image to go live
        run: |
          URL="${{ steps.image.outputs.url }}"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "Image is live after attempt $i."
              exit 0
            fi
            echo "Attempt $i: got $CODE, waiting..."
            sleep 10
          done
          echo "Image never went live after 10 minutes"
          exit 1

      - name: Publish to Facebook + Instagram
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/generate-quickhit-post.py publish

      - name: Commit history
        run: |
          git config user.name "East Agency Bot"
          git config user.email "brannoneast1@gmail.com"
          git add scripts/quickhit_history.json
          git diff --staged --quiet && echo "No history change" || git commit -m "Quick-hit: record post"
          git push
