name: Weekly Social Post

on:
  schedule:
    - cron: '30 14 * * 1'  # Every Monday at 2:30pm UTC (10:30am ET) -- 30 min after the blog post
  workflow_dispatch:        # Run manually any time from GitHub Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate and publish social post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/generate-social-post.py

      - name: Commit history
        run: |
          git config user.name "East Agency Bot"
          git config user.email "brannoneast1@gmail.com"
          git add scripts/social_history.json
          git diff --staged --quiet && echo "No history change" || git commit -m "Auto social: record weekly post"
          git push
